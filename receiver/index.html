<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wi-Fi Speaker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

        }


        .container {

            width: min(90%, 420px);

            padding: 30px;

            text-align: center;

            background: #1c1c1c;

            border-radius: 20px;

        }


        h1 {

            margin-top: 0;

        }


        #device {

            color: #aaa;

            margin-bottom: 20px;

        }


        #status {

            margin: 20px 0;

            color: #aaa;

        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            border: none;

            border-radius: 10px;

            background: #292929;

            color: white;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            outline: 2px solid #555;

        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.98);

        }


        #connectButton {

            margin-top: 20px;

        }


        #renameButton {

            background: #292929;

            color: white;

        }


        #buffer {

            margin-top: 15px;

            color: #888;

            font-size: 14px;

        }


        #error {

            margin-top: 15px;

            color: #ff7777;

            font-size: 13px;

            word-break: break-word;

        }


        #nameEditor {

            display: none;

        }


        .hidden {

            display: none !important;

        }

    </style>

    <link rel="stylesheet" href="/receiver/styles.css">

</head>


<body>


<main class="container">

    <div class="brand-mark" aria-hidden="true">◒</div>

    <p class="eyebrow">Personal audio receiver</p>


    <h1>
        Wi-Fi Speaker
    </h1>


    <!-- Current speaker name -->

    <div id="device">
        Detecting device...
    </div>


    <!-- Rename panel -->

    <div id="nameEditor">

        <input
            id="nameInput"
            type="text"
            maxlength="32"
            placeholder="Speaker name"
            autocomplete="off"
        >

        <button id="saveNameButton">
            Save Name
        </button>

    </div>


    <button id="renameButton">
        Rename Speaker
    </button>


    <div id="status">
        Disconnected
    </div>


    <button id="connectButton">
        Connect
    </button>


    <div id="buffer">
        Buffer: 0 ms
    </div>


    <div id="error"></div>


</main>


<script src="/receiver/script.js"></script>

</body>

</html>
