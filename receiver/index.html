<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wi-Fi Speaker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

        }


        .container {

            width: min(90%, 420px);

            padding: 30px;

            text-align: center;

            background: #1c1c1c;

            border-radius: 20px;

        }


        h1 {

            margin-top: 0;

        }


        #device {

            color: #aaa;

            margin-bottom: 20px;

        }


        #status {

            margin: 20px 0;

            color: #aaa;

        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            border: none;

            border-radius: 10px;

            background: #292929;

            color: white;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            outline: 2px solid #555;

        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.98);

        }


        #connectButton {

            margin-top: 20px;

        }


        #renameButton {

            background: #292929;

            color: white;

        }


        #buffer {

            margin-top: 15px;

            color: #888;

            font-size: 14px;

        }


        #error {

            margin-top: 15px;

            color: #ff7777;

            font-size: 13px;

            word-break: break-word;

        }


        #nameEditor {

            display: none;

        }


        .hidden {

            display: none !important;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Wi-Fi Speaker
    </h1>


    <!-- Current speaker name -->

    <div id="device">
        Detecting device...
    </div>


    <!-- Rename panel -->

    <div id="nameEditor">

        <input
            id="nameInput"
            type="text"
            maxlength="32"
            placeholder="Speaker name"
            autocomplete="off"
        >

        <button id="saveNameButton">
            Save Name
        </button>

    </div>


    <button id="renameButton">
        Rename Speaker
    </button>


    <div id="status">
        Disconnected
    </div>


    <button id="connectButton">
        Connect
    </button>


    <div id="buffer">
        Buffer: 0 ms
    </div>


    <div id="error"></div>


</div>


<script>


/*
 * ==========================================================
 * Configuration
 * ==========================================================
 */

const SAMPLE_RATE = 48000;

const CHANNELS = 2;

const INITIAL_BUFFER_MS = 200;

const MAX_BUFFER_MS = 600;


/*
 * ==========================================================
 * State
 * ==========================================================
 */

let socket = null;

let audioContext = null;

let processor = null;

let audioQueue = [];

let currentPacket = null;

let currentPosition = 0;

let queuedFrames = 0;

let started = false;


/*
 * ==========================================================
 * UI
 * ==========================================================
 */

const status =
    document.getElementById(
        "status"
    );


const button =
    document.getElementById(
        "connectButton"
    );


const bufferDisplay =
    document.getElementById(
        "buffer"
    );


const errorDisplay =
    document.getElementById(
        "error"
    );


const deviceDisplay =
    document.getElementById(
        "device"
    );


const renameButton =
    document.getElementById(
        "renameButton"
    );


const nameEditor =
    document.getElementById(
        "nameEditor"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const saveNameButton =
    document.getElementById(
        "saveNameButton"
    );


/*
 * ==========================================================
 * Device detection
 * ==========================================================
 */

function detectDevice() {

    const ua =
        navigator.userAgent;


    let platform =
        "Unknown Device";


    let browser =
        "Unknown Browser";


    /*
     * Platform
     */

    if (/Android/i.test(ua)) {

        platform = "Android";

    }

    else if (
        /iPhone|iPad|iPod/i.test(ua)
    ) {

        platform = "iOS";

    }

    else if (/Windows/i.test(ua)) {

        platform = "Windows";

    }

    else if (/Macintosh/i.test(ua)) {

        platform = "macOS";

    }

    else if (/Linux/i.test(ua)) {

        platform = "Linux";

    }


    /*
     * Browser
     */

    if (/Edg/i.test(ua)) {

        browser = "Edge";

    }

    else if (/Chrome/i.test(ua)) {

        browser = "Chrome";

    }

    else if (/Firefox/i.test(ua)) {

        browser = "Firefox";

    }

    else if (/Safari/i.test(ua)) {

        browser = "Safari";

    }


    return {
        platform,
        browser
    };

}


const deviceInfo =
    detectDevice();


/*
 * ==========================================================
 * Persistent speaker name
 * ==========================================================
 */

const STORAGE_KEY =
    "wifiSpeakerName";


function getSpeakerName() {

    const savedName =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (
        savedName &&
        savedName.trim().length > 0
    ) {

        return savedName.trim();

    }


    /*
     * First-time default name.
     */

    return `${deviceInfo.platform} • ${deviceInfo.browser}`;

}


function setSpeakerName(name) {

    name =
        name.trim();


    if (!name) {

        name =
            `${deviceInfo.platform} • ${deviceInfo.browser}`;

    }


    localStorage.setItem(
        STORAGE_KEY,
        name
    );


    updateDeviceDisplay();

}


function updateDeviceDisplay() {

    const name =
        getSpeakerName();


    deviceDisplay.textContent =
        `📱 ${name}`;

}


updateDeviceDisplay();


/*
 * ==========================================================
 * Rename UI
 * ==========================================================
 */

renameButton.addEventListener(
    "click",
    () => {

        nameEditor.style.display =
            "block";


        nameInput.value =
            getSpeakerName();


        nameInput.focus();

    }
);


saveNameButton.addEventListener(
    "click",
    () => {

        const newName =
            nameInput.value.trim();


        if (!newName) {

            nameInput.focus();

            return;

        }


        setSpeakerName(
            newName
        );


        nameEditor.style.display =
            "none";


        /*
         * If we're already connected,
         * immediately update the server.
         */

        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            sendIdentification();

        }

    }
);


/*
 * Allow Enter to save.
 */

nameInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            saveNameButton.click();

        }

    }
);


/*
 * ==========================================================
 * Identification
 * ==========================================================
 */

function sendIdentification() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return;

    }


    socket.send(
        JSON.stringify({

            type: "identify",

            name:
                getSpeakerName(),

            platform:
                deviceInfo.platform,

            browser:
                deviceInfo.browser

        })
    );

}


/*
 * ==========================================================
 * Connect
 * ==========================================================
 */

button.addEventListener(
    "click",
    async () => {

        errorDisplay.textContent =
            "";


        /*
         * Disconnect
         */

        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            socket.close();

            return;

        }


        try {

            /*
             * Create audio context after
             * user interaction.
             */

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )({

                    sampleRate:
                        SAMPLE_RATE

                });


            await audioContext.resume();


            /*
             * Continuous audio processor.
             */

            processor =
                audioContext.createScriptProcessor(
                    4096,
                    0,
                    CHANNELS
                );


            processor.onaudioprocess =
                processAudio;


            processor.connect(
                audioContext.destination
            );


            /*
             * =================================================
             * Automatic IP detection
             * =================================================
             *
             * The page was loaded from:
             *
             * http://192.168.1.7:8000
             *
             * Therefore:
             *
             * location.hostname
             *
             * automatically gives:
             *
             * 192.168.1.7
             */

            const laptopIP =
                location.hostname;


            const websocketURL =
                `ws://${laptopIP}:8000/audio`;


            console.log(
                "Connecting to:",
                websocketURL
            );


            socket =
                new WebSocket(
                    websocketURL
                );


            socket.binaryType =
                "arraybuffer";


            /*
             * Connected
             */

            socket.onopen = () => {

                console.log(
                    "WebSocket connected"
                );


                status.textContent =
                    "Connected 🔊";


                button.textContent =
                    "Disconnect";


                /*
                 * Identify ourselves.
                 */

                sendIdentification();


                audioQueue = [];

                currentPacket = null;

                currentPosition = 0;

                queuedFrames = 0;

                started = false;


                updateBufferDisplay();

            };


            /*
             * Receive audio
             */

            socket.onmessage =
                (event) => {

                    const pcm =
                        new Int16Array(
                            event.data
                        );


                    const frameCount =
                        pcm.length /
                        CHANNELS;


                    const left =
                        new Float32Array(
                            frameCount
                        );


                    const right =
                        new Float32Array(
                            frameCount
                        );


                    /*
                     * Convert Int16 → Float32.
                     */

                    for (
                        let i = 0;
                        i < frameCount;
                        i++
                    ) {

                        left[i] =
                            pcm[
                                i * 2
                            ] / 32768;


                        right[i] =
                            pcm[
                                i * 2 + 1
                            ] / 32768;

                    }


                    /*
                     * Add packet.
                     */

                    audioQueue.push({

                        left,
                        right

                    });


                    queuedFrames +=
                        frameCount;


                    /*
                     * Prevent unlimited latency.
                     */

                    const maximumFrames =
                        SAMPLE_RATE *
                        MAX_BUFFER_MS /
                        1000;


                    while (
                        queuedFrames >
                        maximumFrames
                    ) {

                        const removed =
                            audioQueue.shift();


                        if (!removed) {

                            break;

                        }


                        queuedFrames -=
                            removed.left.length;

                    }


                    /*
                     * Start after buffer
                     * reaches 200 ms.
                     */

                    if (
                        !started &&
                        queuedFrames >=
                            SAMPLE_RATE *
                            INITIAL_BUFFER_MS /
                            1000
                    ) {

                        started = true;


                        console.log(
                            "Playback started"
                        );

                    }


                    updateBufferDisplay();

                };


            /*
             * WebSocket error
             */

            socket.onerror =
                () => {

                    status.textContent =
                        "Connection error";


                    errorDisplay.textContent =
                        "Could not connect to laptop.";

                };


            /*
             * WebSocket closed
             */

            socket.onclose =
                () => {

                    status.textContent =
                        "Disconnected";


                    button.textContent =
                        "Connect";


                    audioQueue = [];

                    currentPacket = null;

                    currentPosition = 0;

                    queuedFrames = 0;

                    started = false;


                    updateBufferDisplay();

                };


        }

        catch (error) {

            console.error(
                error
            );


            status.textContent =
                "Audio initialization failed";


            errorDisplay.textContent =
                error.message ||
                String(error);

        }

    }
);


/*
 * ==========================================================
 * Audio processing
 * ==========================================================
 */

function processAudio(event) {

    const outputBuffer =
        event.outputBuffer;


    const leftOutput =
        outputBuffer.getChannelData(
            0
        );


    const rightOutput =
        outputBuffer.numberOfChannels > 1
            ? outputBuffer.getChannelData(
                1
            )
            : null;


    for (
        let i = 0;
        i < leftOutput.length;
        i++
    ) {

        /*
         * Not started yet.
         */

        if (!started) {

            leftOutput[i] = 0;


            if (rightOutput) {

                rightOutput[i] = 0;

            }


            continue;

        }


        /*
         * Get next packet.
         */

        if (
            currentPacket === null ||
            currentPosition >=
                currentPacket.left.length
        ) {

            if (
                audioQueue.length > 0
            ) {

                currentPacket =
                    audioQueue.shift();


                currentPosition =
                    0;

            }

            else {

                /*
                 * Buffer underrun.
                 */

                leftOutput[i] =
                    0;


                if (rightOutput) {

                    rightOutput[i] =
                        0;

                }


                continue;

            }

        }


        /*
         * Left channel.
         */

        leftOutput[i] =
            currentPacket.left[
                currentPosition
            ];


        /*
         * Right channel.
         */

        if (rightOutput) {

            rightOutput[i] =
                currentPacket.right[
                    currentPosition
                ];

        }


        currentPosition++;


        queuedFrames--;

    }


    updateBufferDisplay();

}


/*
 * ==========================================================
 * Buffer display
 * ==========================================================
 */

function updateBufferDisplay() {

    const milliseconds =
        Math.max(

            0,

            Math.round(

                queuedFrames /
                SAMPLE_RATE *
                1000

            )

        );


    bufferDisplay.textContent =
        `Buffer: ${milliseconds} ms`;

}

</script>

</body>

</html>
