<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wi-Fi Speaker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            width: min(90%, 420px);
            padding: 30px;

            text-align: center;

            background: #1c1c1c;
            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
        }

        #device {
            color: #aaa;
            margin-bottom: 20px;
        }

        #status {
            margin: 20px 0;
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: white;
            color: #111;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #buffer {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }

        #error {
            margin-top: 15px;
            color: #ff7777;
            font-size: 13px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Wi-Fi Speaker</h1>

    <div id="device">
        Detecting device...
    </div>

    <div id="status">
        Disconnected
    </div>

    <button id="connectButton">
        Connect
    </button>

    <div id="buffer">
        Buffer: 0 ms
    </div>

    <div id="error"></div>

</div>


<script>

const SAMPLE_RATE = 48000;
const CHANNELS = 2;

const INITIAL_BUFFER_MS = 200;
const MAX_BUFFER_MS = 600;


let socket = null;

let audioContext = null;

let processor = null;

let audioQueue = [];

let currentPacket = null;

let currentPosition = 0;

let queuedFrames = 0;

let started = false;


const status =
    document.getElementById("status");

const button =
    document.getElementById("connectButton");

const bufferDisplay =
    document.getElementById("buffer");

const errorDisplay =
    document.getElementById("error");

const deviceDisplay =
    document.getElementById("device");


/*
 * ==========================================================
 * Device detection
 * ==========================================================
 */

function detectDevice() {

    const ua =
        navigator.userAgent;


    let platform = "Unknown Device";
    let browser = "Unknown Browser";


    /*
     * Platform
     */

    if (/Android/i.test(ua)) {

        platform = "Android";

    } else if (/iPhone|iPad|iPod/i.test(ua)) {

        platform = "iOS";

    } else if (/Windows/i.test(ua)) {

        platform = "Windows";

    } else if (/Macintosh/i.test(ua)) {

        platform = "macOS";

    } else if (/Linux/i.test(ua)) {

        platform = "Linux";
    }


    /*
     * Browser
     */

    if (/Edg/i.test(ua)) {

        browser = "Edge";

    } else if (/Chrome/i.test(ua)) {

        browser = "Chrome";

    } else if (/Firefox/i.test(ua)) {

        browser = "Firefox";

    } else if (/Safari/i.test(ua)) {

        browser = "Safari";
    }


    /*
     * Friendly name
     */

    const name =
        `${platform} • ${browser}`;


    deviceDisplay.textContent =
        `📱 ${name}`;


    return {
        name,
        platform,
        browser
    };
}


const deviceInfo =
    detectDevice();


/*
 * ==========================================================
 * Connect
 * ==========================================================
 */

button.addEventListener(
    "click",
    async () => {

        errorDisplay.textContent = "";


        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            socket.close();

            return;
        }


        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )({
                    sampleRate: SAMPLE_RATE
                });


            await audioContext.resume();


            /*
             * Continuous audio processor.
             */

            processor =
                audioContext.createScriptProcessor(
                    4096,
                    0,
                    CHANNELS
                );


            processor.onaudioprocess =
                processAudio;


            processor.connect(
                audioContext.destination
            );


            /*
             * =================================================
             * AUTOMATIC IP DETECTION
             * =================================================
             *
             * Since the phone loaded this page from:
             *
             * http://192.168.1.7:8000
             *
             * location.hostname is automatically:
             *
             * 192.168.1.7
             *
             * No hardcoded IP anymore.
             */

            const laptopIP =
                location.hostname;


            const websocketURL =
                `ws://${laptopIP}:8000/audio`;


            console.log(
                "Connecting to:",
                websocketURL
            );


            socket =
                new WebSocket(
                    websocketURL
                );


            socket.binaryType =
                "arraybuffer";


            /*
             * =================================================
             * Connected
             * =================================================
             */

            socket.onopen = () => {

                console.log(
                    "WebSocket connected"
                );


                status.textContent =
                    "Connected 🔊";


                button.textContent =
                    "Disconnect";


                /*
                 * Tell Python who we are.
                 */

                socket.send(
                    JSON.stringify({
                        type: "identify",

                        name:
                            deviceInfo.name,

                        platform:
                            deviceInfo.platform,

                        browser:
                            deviceInfo.browser
                    })
                );


                audioQueue = [];

                currentPacket = null;

                currentPosition = 0;

                queuedFrames = 0;

                started = false;


                updateBufferDisplay();
            };


            /*
             * =================================================
             * Receive audio
             * =================================================
             */

            socket.onmessage = (event) => {

                const pcm =
                    new Int16Array(
                        event.data
                    );


                const frameCount =
                    pcm.length / CHANNELS;


                const left =
                    new Float32Array(
                        frameCount
                    );


                const right =
                    new Float32Array(
                        frameCount
                    );


                for (
                    let i = 0;
                    i < frameCount;
                    i++
                ) {

                    left[i] =
                        pcm[i * 2] / 32768;


                    right[i] =
                        pcm[i * 2 + 1] / 32768;
                }


                audioQueue.push({
                    left,
                    right
                });


                queuedFrames +=
                    frameCount;


                const maximumFrames =
                    SAMPLE_RATE *
                    MAX_BUFFER_MS /
                    1000;


                while (
                    queuedFrames >
                    maximumFrames
                ) {

                    const removed =
                        audioQueue.shift();


                    if (!removed) {
                        break;
                    }


                    queuedFrames -=
                        removed.left.length;
                }


                if (
                    !started &&
                    queuedFrames >=
                        SAMPLE_RATE *
                        INITIAL_BUFFER_MS /
                        1000
                ) {

                    started = true;

                    console.log(
                        "Playback started"
                    );
                }


                updateBufferDisplay();
            };


            /*
             * =================================================
             * Error
             * =================================================
             */

            socket.onerror = () => {

                status.textContent =
                    "Connection error";


                errorDisplay.textContent =
                    "Could not connect to laptop.";
            };


            /*
             * =================================================
             * Closed
             * =================================================
             */

            socket.onclose = () => {

                status.textContent =
                    "Disconnected";


                button.textContent =
                    "Connect";


                audioQueue = [];

                currentPacket = null;

                currentPosition = 0;

                queuedFrames = 0;

                started = false;


                updateBufferDisplay();
            };

        } catch (error) {

            console.error(error);

            status.textContent =
                "Audio initialization failed";


            errorDisplay.textContent =
                error.message ||
                String(error);
        }
    }
);


/*
 * ==========================================================
 * Audio processing
 * ==========================================================
 */

function processAudio(event) {

    const outputBuffer =
        event.outputBuffer;


    const leftOutput =
        outputBuffer.getChannelData(0);


    const rightOutput =
        outputBuffer.numberOfChannels > 1
            ? outputBuffer.getChannelData(1)
            : null;


    for (
        let i = 0;
        i < leftOutput.length;
        i++
    ) {

        if (!started) {

            leftOutput[i] = 0;

            if (rightOutput) {
                rightOutput[i] = 0;
            }

            continue;
        }


        if (
            currentPacket === null ||
            currentPosition >=
                currentPacket.left.length
        ) {

            if (
                audioQueue.length > 0
            ) {

                currentPacket =
                    audioQueue.shift();

                currentPosition = 0;

            } else {

                leftOutput[i] = 0;

                if (rightOutput) {
                    rightOutput[i] = 0;
                }

                continue;
            }
        }


        leftOutput[i] =
            currentPacket.left[
                currentPosition
            ];


        if (rightOutput) {

            rightOutput[i] =
                currentPacket.right[
                    currentPosition
                ];
        }


        currentPosition++;

        queuedFrames--;
    }


    updateBufferDisplay();
}


/*
 * ==========================================================
 * Buffer display
 * ==========================================================
 */

function updateBufferDisplay() {

    const milliseconds =
        Math.max(
            0,
            Math.round(
                queuedFrames /
                SAMPLE_RATE *
                1000
            )
        );


    bufferDisplay.textContent =
        `Buffer: ${milliseconds} ms`;
}

</script>

</body>
</html>
